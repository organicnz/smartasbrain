# CI for smartasbrain, executed on any available Linux VPS pool worker.
#
# SECURITY: this repository is public and uses a self-hosted runner. Do NOT
# add a `pull_request` trigger — pull requests from forks would be able to
# execute arbitrary code on the runner machine.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt + clippy + test (self-hosted)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ensure cargo is on PATH
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo --version
          rustc --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Release build
        run: cargo build --locked --release -p platform
